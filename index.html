<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Google Tasks</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <div class="mx-auto max-w-2xl px-4 py-8">
    <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">My Google Tasks</h1>
        <p id="statusText" class="text-xs text-slate-500">체험 모드 · 클라이언트 ID 입력 후 Google 로그인하세요</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="modeBadge" class="rounded-full bg-amber-100 px-3 py-1 text-xs font-medium text-amber-800">체험 모드</span>
        <button id="toggleSettingsBtn" type="button" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100">API 연결</button>
      </div>
    </header>

    <section id="settingsPanel" class="mb-6 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="mb-2 flex items-center justify-between">
        <h2 class="text-sm font-semibold">Google Tasks API 연결</h2>
        <button id="signOutBtn" type="button" class="hidden rounded-lg border border-slate-200 px-2.5 py-1 text-xs text-slate-600 hover:bg-slate-100">로그아웃</button>
      </div>
      <div class="flex flex-col gap-2 sm:flex-row">
        <input id="clientIdInput" type="text" placeholder="OAuth 클라이언트 ID (...apps.googleusercontent.com)" class="flex-1 rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-sm focus:border-blue-500 focus:bg-white focus:outline-none" />
        <button id="saveIdBtn" type="button" class="rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">ID 저장</button>
        <button id="signInBtn" type="button" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Google 로그인</button>
      </div>
    </section>

    <main class="rounded-2xl border border-slate-200 bg-white shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 px-4 py-3">
        <div class="flex items-center gap-2">
          <select id="listSelect" class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm font-semibold"></select>
          <button id="refreshBtn" type="button" class="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs text-slate-600 hover:bg-slate-100">새로고침</button>
        </div>
        <div class="flex gap-1 rounded-lg bg-slate-100 p-1 text-xs font-medium">
          <button type="button" data-filter="all" class="filter-btn rounded-md px-2.5 py-1">전체 <span id="countAll">0</span></button>
          <button type="button" data-filter="active" class="filter-btn rounded-md px-2.5 py-1">진행 중 <span id="countActive">0</span></button>
          <button type="button" data-filter="completed" class="filter-btn rounded-md px-2.5 py-1">완료 <span id="countCompleted">0</span></button>
        </div>
      </div>

      <form id="addForm" class="border-b border-slate-100 bg-slate-50/60 p-4">
        <div class="flex flex-col gap-2 sm:flex-row">
          <input id="titleInput" type="text" required placeholder="새 할 일을 입력하세요..." class="flex-1 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm focus:border-blue-500 focus:outline-none" />
          <input id="dueInput" type="date" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700" />
          <button type="submit" class="rounded-xl bg-slate-900 px-5 py-2 text-sm font-semibold text-white hover:bg-slate-800">추가</button>
        </div>
        <input id="notesInput" type="text" placeholder="메모 (선택 사항)" class="mt-2 w-full rounded-lg border border-transparent bg-transparent px-2 py-1 text-xs text-slate-600 focus:border-slate-200 focus:bg-white focus:outline-none" />
      </form>

      <div id="loadingEl" class="hidden py-8 text-center text-sm text-slate-500">불러오는 중...</div>
      <ul id="taskList" class="divide-y divide-slate-100"></ul>
      <div id="emptyEl" class="hidden py-10 text-center text-sm text-slate-400">표시할 할 일이 없습니다.</div>
    </main>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-2 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity"></div>

  <script>
    // 여기에 클라이언트 ID를 직접 넣으면 매번 입력하지 않아도 됩니다.
    const DEFAULT_CLIENT_ID = "";

    const SCOPE = "https://www.googleapis.com/auth/tasks";
    const API = "https://tasks.googleapis.com/tasks/v1";
    const KEY = "gh_pages_google_tasks_client_id";

    const state = {
      mode: "demo",
      accessToken: null,
      filter: "all",
      lists: [{ id: "demo", title: "내 할 일 (체험용)" }],
      selectedListId: "demo",
      tasksByList: {
        demo: [
          { id: "d1", title: "상단에 OAuth 클라이언트 ID 붙여넣기", notes: "", due: "", status: "needsAction" },
          { id: "d2", title: "Google 로그인 눌러 연동 확인하기", notes: "", due: "", status: "needsAction" }
        ]
      }
    };

    const $ = (id) => document.getElementById(id);
    let toastTimer;

    function toast(msg) {
      $("toast").textContent = msg;
      $("toast").classList.remove("opacity-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $("toast").classList.add("opacity-0"), 2800);
    }

    function setLoading(on) {
      $("loadingEl").classList.toggle("hidden", !on);
      $("taskList").classList.toggle("opacity-40", on);
    }

    function updateHeader() {
      if (state.mode === "google") {
        $("modeBadge").className = "rounded-full bg-emerald-100 px-3 py-1 text-xs font-medium text-emerald-800";
        $("modeBadge").textContent = "Google 연동됨";
        $("statusText").textContent = "Google Tasks와 실시간 동기화 중";
        $("signOutBtn").classList.remove("hidden");
      } else {
        $("modeBadge").className = "rounded-full bg-amber-100 px-3 py-1 text-xs font-medium text-amber-800";
        $("modeBadge").textContent = "체험 모드";
        $("statusText").textContent = "체험 모드 · 클라이언트 ID 입력 후 Google 로그인하세요";
        $("signOutBtn").classList.add("hidden");
      }
    }

    function renderLists() {
      $("listSelect").innerHTML = "";
      state.lists.forEach((l) => {
        const opt = document.createElement("option");
        opt.value = l.id;
        opt.textContent = l.title;
        if (l.id === state.selectedListId) opt.selected = true;
        $("listSelect").appendChild(opt);
      });
    }

    function renderTasks() {
      const all = state.tasksByList[state.selectedListId] || [];
      $("countAll").textContent = all.length;
      $("countActive").textContent = all.filter((t) => t.status !== "completed").length;
      $("countCompleted").textContent = all.filter((t) => t.status === "completed").length;

      document.querySelectorAll(".filter-btn").forEach((b) => {
        const active = b.dataset.filter === state.filter;
        b.classList.toggle("bg-white", active);
        b.classList.toggle("shadow-sm", active);
      });

      const list = all.filter((t) =>
        state.filter === "active" ? t.status !== "completed" :
        state.filter === "completed" ? t.status === "completed" : true
      );

      $("taskList").innerHTML = "";
      $("emptyEl").classList.toggle("hidden", list.length > 0);

      list.forEach((task) => {
        const done = task.status === "completed";
        const li = document.createElement("li");
        li.className = "flex items-start justify-between gap-3 px-4 py-3.5 hover:bg-slate-50";

        const left = document.createElement("div");
        left.className = "flex min-w-0 flex-1 items-start gap-3";

        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.checked = done;
        chk.className = "mt-1 h-4 w-4 cursor-pointer accent-blue-600";
        chk.addEventListener("change", () => toggleTask(task));

        const info = document.createElement("div");
        info.className = "min-w-0 flex-1";
        const title = document.createElement("p");
        title.className = done ? "text-sm text-slate-400 line-through" : "text-sm font-medium text-slate-800";
        title.textContent = task.title || "(제목 없음)";
        info.appendChild(title);

        if (task.notes) {
          const n = document.createElement("p");
          n.className = "mt-0.5 text-xs text-slate-500";
          n.textContent = task.notes;
          info.appendChild(n);
        }
        if (task.due) {
          const d = document.createElement("span");
          d.className = "mt-1 inline-block rounded bg-blue-50 px-2 py-0.5 text-[11px] text-blue-700";
          d.textContent = "마감 " + task.due.slice(0, 10);
          info.appendChild(d);
        }

        left.append(chk, info);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "rounded px-2 py-1 text-xs text-slate-400 hover:bg-red-50 hover:text-red-600";
        del.textContent = "삭제";
        del.addEventListener("click", () => deleteTask(task));

        li.append(left, del);
        $("taskList").appendChild(li);
      });
    }

    async function apiFetch(path, opts = {}) {
      const res = await fetch(API + path, {
        ...opts,
        headers: {
          Authorization: "Bearer " + state.accessToken,
          "Content-Type": "application/json",
          ...(opts.headers || {})
        }
      });
      if (!res.ok) throw new Error("API 오류 (" + res.status + ")");
      return res.status === 204 ? null : res.json();
    }

    async function loadGoogleData() {
      setLoading(true);
      try {
        const data = await apiFetch("/users/@me/lists");
        state.lists = (data.items || []).map((l) => ({ id: l.id, title: l.title }));
        if (!state.lists.length) state.lists = [{ id: "@default", title: "내 할 일" }];
        if (!state.lists.some((l) => l.id === state.selectedListId)) state.selectedListId = state.lists[0].id;
        renderLists();
        await loadTasks();
      } catch (e) {
        toast(e.message);
      } finally {
        setLoading(false);
      }
    }

    async function loadTasks() {
      setLoading(true);
      try {
        const data = await apiFetch("/lists/" + encodeURIComponent(state.selectedListId) + "/tasks?showCompleted=true&showHidden=true&maxResults=100");
        state.tasksByList[state.selectedListId] = data.items || [];
        renderTasks();
      } catch (e) {
        toast(e.message);
      } finally {
        setLoading(false);
      }
    }

    async function addTask(e) {
      e.preventDefault();
      const title = $("titleInput").value.trim();
      if (!title) return;
      const notes = $("notesInput").value.trim();
      const due = $("dueInput").value;

      if (state.mode === "google") {
        try {
          const body = { title };
          if (notes) body.notes = notes;
          if (due) body.due = due + "T00:00:00.000Z";
          const created = await apiFetch("/lists/" + encodeURIComponent(state.selectedListId) + "/tasks", {
            method: "POST",
            body: JSON.stringify(body)
          });
          state.tasksByList
